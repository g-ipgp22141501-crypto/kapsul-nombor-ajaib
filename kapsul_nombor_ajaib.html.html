<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kapsul Nombor Ajaib 0–10</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff2d5,#def6ff 65%,#f6e4ff);color:#28334d}.wrap{max-width:530px;margin:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}h1{font-size:25px;margin:8px 0 0}.sub{font-size:14px;margin:0 0 3px}.scene{width:100%;max-width:420px;height:348px;position:relative;overflow:hidden;border:3px solid white;border-radius:24px;background:linear-gradient(#9de5ff,#e8fbff 73%,#ffe4a8 73%)}.machine{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:245px;height:255px}.dome{position:absolute;left:10px;top:22px;width:225px;height:171px;border:7px solid #ff7298;border-radius:47% 47% 23% 23%;background:radial-gradient(circle at 25% 18%,#ffffffbd,transparent 48%),#c4eeff88;overflow:hidden}.ball{position:absolute;width:48px;height:48px;border-radius:50%;border:3px solid #ffffff99;box-shadow:inset -7px -8px 8px #0002;display:grid;place-items:center;font-size:21px;font-weight:900}.mix .ball{animation:mix .28s infinite alternate}.mix .ball:nth-child(even){animation-delay:-.14s}@keyframes mix{to{transform:translate(9px,-12px) rotate(25deg)}}.base{position:absolute;top:185px;left:0;width:245px;height:70px;background:linear-gradient(110deg,#ff6b92,#f34e7d);border:6px solid #d83c73;border-radius:13px 13px 23px 23px;display:flex;align-items:center;justify-content:center;gap:22px}.knob{width:49px;height:49px;border-radius:50%;background:#ffe578;border:5px solid #efa52b;display:grid;place-items:center;font-size:24px}.exit{width:75px;height:52px;border-radius:17px;background:#47305c;border:5px solid #ffd66a;display:grid;place-items:center;color:white;font-size:24px}.ramp{position:absolute;top:253px;left:50%;transform:translateX(-50%);width:290px;height:65px;background:linear-gradient(#ffe98b,#ffb84b);border:6px solid #e99328;border-radius:8px 8px 32px 32px;clip-path:polygon(26% 0,74% 0,100% 100%,0 100%)}.tray{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:190px;height:28px;border-radius:50%;background:#ff9e46;border:5px solid #e47b23}.rolling{position:absolute;left:calc(50% - 24px);top:222px;width:49px;height:49px;border-radius:50%;border:3px solid white;background:linear-gradient(#ff637f 0 49%,#fff2b5 50%);box-shadow:0 4px 12px #0004;display:none;place-items:center;font-size:23px;font-weight:900;color:#703c83;z-index:5}.rolling.go{display:grid;animation:roll 2.3s ease-in-out forwards}@keyframes roll{0%{top:222px;left:calc(50% - 24px);transform:scale(.5) rotate(0)}25%{top:246px;left:calc(50% - 24px);transform:scale(.9) rotate(160deg)}55%{top:268px;left:calc(50% + 60px);transform:rotate(440deg)}80%{top:290px;left:calc(50% - 50px);transform:rotate(760deg)}100%{top:289px;left:calc(50% - 24px);transform:rotate(1080deg)}}.shake{animation:shake .16s infinite}@keyframes shake{50%{transform:translateX(-50%) rotate(2deg)}}.resultbox{width:100%;max-width:400px;border-radius:18px;background:#ffffffcf;padding:12px;display:flex;flex-direction:column;align-items:center;gap:7px}.big{width:100px;height:100px;border-radius:50%;border:6px solid white;background:radial-gradient(circle at 30% 25%,#fff2a2,#ffb53e 75%);box-shadow:0 5px 15px #0002;display:grid;place-items:center;font-size:56px;font-weight:900;color:#713a9c}.pop{animation:pop .65s cubic-bezier(.2,1.5,.5,1)}@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}button{border:0;cursor:pointer;border-radius:17px;font-weight:900}.main{padding:14px 22px;font-size:17px;background:linear-gradient(90deg,#ff628c,#ff9d45);color:white;box-shadow:0 5px 0 #d24e61}.small{padding:10px 13px;font-size:12px;background:white;color:#644a88}button:disabled{opacity:.55}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.settings{width:100%;max-width:400px;border-radius:14px;background:#ffffffb8;padding:12px;text-align:left;font-size:13px}.settings select{width:100%;padding:9px;border-radius:10px;border:1px solid #ccc;background:white;margin:7px 0}.settings label{display:flex;gap:8px;align-items:center}.status,.history{font-size:12px;color:#526780;margin:6px 0}.tag{position:absolute;top:8px;background:#ffffffcc;padding:5px 9px;border-radius:12px;font-size:12px;font-weight:bold}.left{left:8px}.right{right:8px}
</style></head><body><main class="wrap"><h1>🌈 KAPSUL NOMBOR AJAIB</h1><p class="sub">Dengar arahan guru dan lihat kapsul bergolek!</p><section class="scene"><div class="machine" id="machine"><div class="dome" id="dome"></div><div class="base"><div class="knob">⭐</div><div class="exit" id="exit">⬇️</div></div></div><div class="ramp"></div><div class="tray"></div><div class="rolling" id="rolling">?</div><div class="tag left">🔢 0–10</div><div class="tag right">🎁 Pusingan <span id="count">0</span></div></section><section class="resultbox"><strong id="stage">NOMBOR MISTERI</strong><div class="big" id="result">?</div><div id="message">Tekan butang untuk mengeluarkan kapsul.</div></section><button class="main" id="go">🎁 KELUARKAN KAPSUL</button><div class="controls"><button class="small" id="repeat">🔊 DENGAR SEMULA</button><button class="small" id="reset">↻ MULA SEMULA</button></div><section class="settings"><strong>Pilihan suara Bahasa Melayu</strong><select id="voices"><option>Mengesan suara...</option></select><label><input id="audio" type="checkbox" checked> Aktifkan audio</label><p class="status" id="status">Mengesan suara Bahasa Melayu pada peranti.</p></section><p class="history" id="history">Nombor dipilih secara rawak daripada 0 hingga 10.</p></main><script>
const $=id=>document.getElementById(id),words=['sifar','satu','dua','tiga','empat','lima','enam','tujuh','lapan','sembilan','sepuluh'],colors=['#ff8faa','#ffd66b','#87dfb1','#87caff','#c6a4f5','#ffb37a'];let voices=[],last=null,count=0,history=[],busy=false,seq=0;
for(let i=0;i<12;i++){let b=document.createElement('div');b.className='ball';b.style.left=(8+i%4*51)+'px';b.style.top=(10+Math.floor(i/4)*48)+'px';b.style.background=colors[i%6];b.textContent=i%11;$('dome').appendChild(b)}
function loadVoices(){const s=$('voices');s.innerHTML='';if(!('speechSynthesis' in window)){s.innerHTML='<option>Audio tidak disokong</option>';$('status').textContent='Pelayar ini tidak menyokong suara automatik.';return}voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ms'));voices.sort((a,b)=>Number(/female|perempuan|woman|zira|siti/i.test(b.name))-Number(/female|perempuan|woman|zira|siti/i.test(a.name)));if(!voices.length){s.innerHTML='<option>Tiada suara Bahasa Melayu ditemui</option>';$('status').textContent='Suara Bahasa Melayu tidak ditemui. Pasang suara Bahasa Melayu pada peranti.';return}voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});$('status').textContent='Pilih suara yang paling jelas. Suara perempuan bergantung pada peranti.'}
function say(t){if(!$('audio').checked||!('speechSynthesis' in window)||!voices.length)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=voices[Number($('voices').value)||0];u.lang='ms-MY';u.rate=.78;u.pitch=1.07;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
const wait=ms=>new Promise(res=>setTimeout(res,ms));
$('go').onclick=async()=>{if(busy)return;busy=true;const run=++seq;$('go').disabled=true;$('rolling').classList.remove('go');$('rolling').style.display='none';$('result').textContent='?';$('stage').textContent='MESIN SEDANG BERGERAK';$('message').textContent='Perhatikan kapsul yang sedang dikacau.';$('dome').classList.add('mix');$('machine').classList.add('shake');$('exit').textContent='✨';say('Mari kita mulakan. Lihat kapsul yang sedang bergerak.');await wait(3200);if(run!==seq)return;$('dome').classList.remove('mix');$('machine').classList.remove('shake');$('stage').textContent='KAPSUL SEDANG BERGOLEK';$('message').textContent='Sebiji kapsul sedang bergolek keluar.';const n=Math.floor(Math.random()*11);$('rolling').textContent='?';$('rolling').style.display='grid';void $('rolling').offsetWidth;$('rolling').classList.add('go');say('Kapsul sedang bergolek keluar.');await wait(2600);if(run!==seq)return;$('rolling').textContent=n;$('result').textContent=n;$('result').classList.remove('pop');void $('result').offsetWidth;$('result').classList.add('pop');$('stage').textContent='NOMBOR TELAH DIPILIH';$('message').textContent='Nombor yang terpilih ialah '+words[n]+'.';$('exit').textContent='🎁';last=n;count++;$('count').textContent=count;history.unshift(n);history=history.slice(0,8);$('history').textContent='Nombor terdahulu: '+history.join(' • ');say('Nombor yang terpilih ialah... '+words[n]+'. Bagus!');$('go').textContent='🎁 KAPSUL SETERUSNYA';$('go').disabled=false;busy=false};
$('repeat').onclick=()=>say(last===null?'Tekan butang untuk mengeluarkan kapsul.':'Nombor yang terpilih ialah... '+words[last]+'.');
$('reset').onclick=()=>{seq++;busy=false;$('go').disabled=false;$('go').textContent='🎁 KELUARKAN KAPSUL';$('dome').classList.remove('mix');$('machine').classList.remove('shake');$('rolling').classList.remove('go');$('rolling').style.display='none';$('result').textContent='?';$('stage').textContent='NOMBOR MISTERI';$('message').textContent='Tekan butang untuk mengeluarkan kapsul.';$('exit').textContent='⬇️';$('count').textContent='0';$('history').textContent='Nombor dipilih secara rawak daripada 0 hingga 10.';last=null;count=0;history=[];if('speechSynthesis' in window)speechSynthesis.cancel()};
loadVoices();if('speechSynthesis' in window)speechSynthesis.addEventListener?.('voiceschanged',loadVoices);
</script></body></html>
